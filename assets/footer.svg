<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Thanks for visiting - let's build together">
<defs><linearGradient id="n" x1="0" x2="1200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00e5ff"/><stop offset=".5" stop-color="#ff00c8"/><stop offset="1" stop-color="#00e5ff"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1200 0;0 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<clipPath id="f"><rect width="1200" height="200" rx="18"/></clipPath>
<style>.wave{animation:s 12s linear infinite}.w2{animation-duration:18s;animation-direction:reverse}@keyframes s{from{transform:translateX(0)}to{transform:translateX(-600px)}}
.t{font:800 44px 'Segoe UI',Ubuntu,Arial,sans-serif}.s{font:16px 'Fira Code','JetBrains Mono',Consolas,monospace;fill:#8b949e}
.h{animation:beat 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes beat{0%,60%,100%{transform:scale(1)}30%{transform:scale(1.25)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style></defs>
<g clip-path="url(#f)">
<rect width="1200" height="200" fill="#05070d"/>
<path class="wave" fill="#00e5ff" fill-opacity=".14" d="M0 40 Q150 0 300 40 T600 40 T900 40 T1200 40 T1500 40 T1800 40 V0 H0Z"/>
<path class="wave w2" fill="#ff00c8" fill-opacity=".14" d="M0 30 Q150 70 300 30 T600 30 T900 30 T1200 30 T1500 30 T1800 30 V0 H0Z"/>
<text class="t" x="600" y="122" text-anchor="middle" fill="url(#n)">Thanks for visiting</text>
<text class="s" x="600" y="160" text-anchor="middle">open an issue · improve the docs · share an idea · say hi <tspan class="h" fill="#ff00c8">♥</tspan></text>
</g></svg>