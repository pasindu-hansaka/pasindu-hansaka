<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Pasindu Hansaka - Python, AI agents and control systems">
<defs><linearGradient id="gold" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#c9a961"/><stop offset=".45" stop-color="#c9a961"/><stop offset=".5" stop-color="#fff4d6"/><stop offset=".55" stop-color="#c9a961"/><stop offset="1" stop-color="#c9a961"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1200 0;1200 0" dur="7s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="#173528"/><stop offset="1" stop-color="#0b1a14"/></radialGradient>
<pattern id="lin" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6L6 0" stroke="#c9a961" stroke-opacity=".035"/></pattern>
<style>
.f{animation:in 1.6s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rule{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2s .8s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.seal{transform-origin:600px 62px;animation:turn 60s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style></defs>
<rect width="1200" height="320" rx="6" fill="url(#vig)"/><rect width="1200" height="320" fill="url(#lin)"/>
<rect x="1" y="1" width="1198" height="318" rx="6" fill="none" stroke="#c9a961" stroke-opacity=".75" stroke-width="1.5"/>
<rect x="10" y="10" width="1180" height="300" rx="3" fill="none" stroke="#c9a961" stroke-opacity=".35"/>
<path d="M10 32 L10 10 L32 10" fill="none" stroke="#c9a961" stroke-width="2"/><rect x="12.5" y="12.5" width="5" height="5" transform="rotate(45 15 15)" fill="#c9a961"/><path d="M1190 32 L1190 10 L1168 10" fill="none" stroke="#c9a961" stroke-width="2"/><rect x="1182.5" y="12.5" width="5" height="5" transform="rotate(45 1185 15)" fill="#c9a961"/><path d="M10 288 L10 310 L32 310" fill="none" stroke="#c9a961" stroke-width="2"/><rect x="12.5" y="302.5" width="5" height="5" transform="rotate(45 15 305)" fill="#c9a961"/><path d="M1190 288 L1190 310 L1168 310" fill="none" stroke="#c9a961" stroke-width="2"/><rect x="1182.5" y="302.5" width="5" height="5" transform="rotate(45 1185 305)" fill="#c9a961"/>
<g class="f">
<g class="seal"><circle cx="600" cy="62" r="30" fill="none" stroke="#c9a961" stroke-opacity=".6" stroke-dasharray="2 5"/></g>
<circle cx="600" cy="62" r="23" fill="#0b1a14" stroke="#c9a961" stroke-width="1.2"/>
<text x="600" y="70" text-anchor="middle" font-family="'Cormorant Garamond','Playfair Display',Garamond,Baskerville,'Times New Roman',Georgia,serif" font-size="22" font-style="italic" fill="#e8d5a3">PH</text>
</g>
<text class="f" x="600" y="168" text-anchor="middle" font-family="'Cormorant Garamond','Playfair Display',Garamond,Baskerville,'Times New Roman',Georgia,serif" font-size="76" font-weight="600" letter-spacing="2" fill="url(#gold)" style="animation-delay:.3s">Pasindu Hansaka</text>
<g stroke="#c9a961" stroke-width="1">
<path class="rule" d="M380 196 H580"/><path class="rule" d="M820 196 H620"/>
</g>
<rect x="595" y="191" width="10" height="10" transform="rotate(45 600 196)" fill="none" stroke="#c9a961" class="f" style="animation-delay:1.2s"/>
<text class="f" x="600" y="236" text-anchor="middle" font-family="'Cormorant Garamond','Playfair Display',Garamond,Baskerville,'Times New Roman',Georgia,serif" font-size="20" letter-spacing="6" fill="#f3ead8" style="animation-delay:.9s">PYTHON  ·  AI AGENTS  ·  CONTROL SYSTEMS</text>
<text class="f" x="600" y="276" text-anchor="middle" font-family="'Cormorant Garamond','Playfair Display',Garamond,Baskerville,'Times New Roman',Georgia,serif" font-size="15" font-style="italic" letter-spacing="3" fill="#a89f8a" style="animation-delay:1.4s">— Est. MMXXV —</text>
</svg>