<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 294" width="640" height="294" role="img" aria-label="Toolbox: Python, HTML5, Jupyter, MATLAB, Simulink, Git, GitHub">
<defs><clipPath id="t"><rect x="38" y="36" height="30" width="0"><animate attributeName="width" values="0;260" begin=".2s" dur=".7s" fill="freeze"/></rect></clipPath>
<style>text{font-family:'Fira Code','JetBrains Mono',Consolas,monospace}.p{font-size:16px;fill:#00e5ff}.grp{font-size:15px;fill:#ff00c8;animation:in .5s both}.cn{font-size:15px;fill:#e6edf3}
.chip{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}@keyframes in{from{opacity:0}to{opacity:1}}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style></defs>
<rect x="1" y="1" width="638" height="292" rx="14" fill="#0b1220" stroke="#00e5ff" stroke-opacity=".35" stroke-width="2"/>
<text class="p" x="40" y="56" clip-path="url(#t)"><tspan fill="#ff00c8">$ </tspan>toolbox --list</text>
<text class="p cur" x="580" y="56">▌</text>
<text class="grp" x="40" y="105" style="animation-delay:0.90s">code/</text><g class="chip" style="animation-delay:1.00s"><rect x="170" y="85" width="92" height="28" rx="14" fill="#111a2c" stroke="#3776ab" stroke-opacity=".7"/><circle cx="185" cy="99" r="5" fill="#3776ab"/><text x="196" y="104" class="cn">Python</text></g><g class="chip" style="animation-delay:1.12s"><rect x="273.6" y="85" width="82" height="28" rx="14" fill="#111a2c" stroke="#e34f26" stroke-opacity=".7"/><circle cx="288.6" cy="99" r="5" fill="#e34f26"/><text x="299.6" y="104" class="cn">HTML5</text></g><text class="grp" x="40" y="151" style="animation-delay:1.15s">data/</text><g class="chip" style="animation-delay:1.24s"><rect x="170" y="131" width="101" height="28" rx="14" fill="#111a2c" stroke="#f37626" stroke-opacity=".7"/><circle cx="185" cy="145" r="5" fill="#f37626"/><text x="196" y="150" class="cn">Jupyter</text></g><text class="grp" x="40" y="197" style="animation-delay:1.40s">control/</text><g class="chip" style="animation-delay:1.36s"><rect x="170" y="177" width="92" height="28" rx="14" fill="#111a2c" stroke="#0076a8" stroke-opacity=".7"/><circle cx="185" cy="191" r="5" fill="#0076a8"/><text x="196" y="196" class="cn">MATLAB</text></g><g class="chip" style="animation-delay:1.48s"><rect x="273.6" y="177" width="111" height="28" rx="14" fill="#111a2c" stroke="#e16737" stroke-opacity=".7"/><circle cx="288.6" cy="191" r="5" fill="#e16737"/><text x="299.6" y="196" class="cn">Simulink</text></g><text class="grp" x="40" y="243" style="animation-delay:1.65s">tools/</text><g class="chip" style="animation-delay:1.60s"><rect x="170" y="223" width="63" height="28" rx="14" fill="#111a2c" stroke="#f05032" stroke-opacity=".7"/><circle cx="185" cy="237" r="5" fill="#f05032"/><text x="196" y="242" class="cn">Git</text></g><g class="chip" style="animation-delay:1.72s"><rect x="244.8" y="223" width="92" height="28" rx="14" fill="#111a2c" stroke="#c9d1d9" stroke-opacity=".7"/><circle cx="259.8" cy="237" r="5" fill="#c9d1d9"/><text x="270.8" y="242" class="cn">GitHub</text></g>
</svg>