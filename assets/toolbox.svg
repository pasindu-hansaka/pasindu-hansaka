<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" role="img" aria-label="Toolbox: Python, HTML5, Jupyter, MATLAB, Simulink, Git, GitHub">
<defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" seed="3"/>
<feColorMatrix values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .09 0"/></filter>
<filter id="blot" x="-50%" y="-50%" width="200%" height="200%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .4  0 0 0 0 .2  0 0 0 .18 -.04"/></filter>
<radialGradient id="age" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#f3e9d2" stop-opacity="0"/><stop offset="1" stop-color="#e3cfa6"/></radialGradient><clipPath id="p0"><rect x="0" y="30" height="50" width="0"><animate attributeName="width" values="0;640" begin="0.1s" dur="1.2s" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1" fill="freeze"/></rect></clipPath><style>text{font-family:'EB Garamond','Cormorant Garamond',Garamond,Baskerville,'Times New Roman',Georgia,serif;fill:#2a1f14}
.in{animation:in 1.4s ease-out both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fade 1.6s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}
.stamp{animation:stamp .6s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes stamp{0%{opacity:0;transform:scale(1.8) rotate(-8deg)}100%{opacity:1;transform:none}}
.ink{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.2s ease-in-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style></defs>
<rect width="640" height="318" rx="4" fill="#f3e9d2"/><rect width="640" height="318" rx="4" filter="url(#blot)"/><rect width="640" height="318" rx="4" fill="url(#age)"/><rect width="640" height="318" rx="4" filter="url(#grain)"/><rect x=".5" y=".5" width="639" height="317" rx="4" fill="none" stroke="#bfa77a"/>
<text x="320.0" y="64" text-anchor="middle" font-size="28" font-style="italic" clip-path="url(#p0)">Instruments of the Trade</text>
<text class="fade" x="60" y="125" font-size="14" letter-spacing="4" style="fill:#6b5232;animation-delay:0.4s">CODE</text><g transform="rotate(-1.6 258 120)"><g class="stamp" style="animation-delay:0.80s"><rect x="210" y="102" width="97" height="32" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="213" y="105" width="91" height="26" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="258" y="125" text-anchor="middle" font-size="17" letter-spacing="1" style="fill:#8e1b1b">PYTHON</text></g></g><g transform="rotate(-2.4 366 120)"><g class="stamp" style="animation-delay:1.05s"><rect x="323.0" y="102" width="86" height="32" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="326.0" y="105" width="80" height="26" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="366" y="125" text-anchor="middle" font-size="17" letter-spacing="1" style="fill:#8e1b1b">HTML5</text></g></g><text class="fade" x="60" y="177" font-size="14" letter-spacing="4" style="fill:#6b5232;animation-delay:0.7s">DATA</text><g transform="rotate(-0.6 264 172)"><g class="stamp" style="animation-delay:1.30s"><rect x="210" y="154" width="108" height="32" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="213" y="157" width="102" height="26" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="264" y="177" text-anchor="middle" font-size="17" letter-spacing="1" style="fill:#8e1b1b">JUPYTER</text></g></g><text class="fade" x="60" y="229" font-size="14" letter-spacing="4" style="fill:#6b5232;animation-delay:1.0s">CONTROL</text><g transform="rotate(-2.1 258 224)"><g class="stamp" style="animation-delay:1.55s"><rect x="210" y="206" width="97" height="32" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="213" y="209" width="91" height="26" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="258" y="229" text-anchor="middle" font-size="17" letter-spacing="1" style="fill:#8e1b1b">MATLAB</text></g></g><g transform="rotate(-2.6 382 224)"><g class="stamp" style="animation-delay:1.80s"><rect x="323.0" y="206" width="118" height="32" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="326.0" y="209" width="112" height="26" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="382" y="229" text-anchor="middle" font-size="17" letter-spacing="1" style="fill:#8e1b1b">SIMULINK</text></g></g><text class="fade" x="60" y="281" font-size="14" letter-spacing="4" style="fill:#6b5232;animation-delay:1.3s">TOOLS</text><g transform="rotate(-0.6 243 276)"><g class="stamp" style="animation-delay:2.05s"><rect x="210" y="258" width="66" height="32" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="213" y="261" width="60" height="26" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="243" y="281" text-anchor="middle" font-size="17" letter-spacing="1" style="fill:#8e1b1b">GIT</text></g></g><g transform="rotate(2.5 340 276)"><g class="stamp" style="animation-delay:2.30s"><rect x="291.5" y="258" width="97" height="32" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="294.5" y="261" width="91" height="26" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="340" y="281" text-anchor="middle" font-size="17" letter-spacing="1" style="fill:#8e1b1b">GITHUB</text></g></g>
</svg>