<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 130" width="752" height="130" role="img" aria-label="Tech stack: Python, C++, Jupyter, MATLAB, Simulink, Git, GitHub">
<defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" seed="3"/>
<feColorMatrix values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .09 0"/></filter>
<filter id="blot" x="-50%" y="-50%" width="200%" height="200%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .4  0 0 0 0 .2  0 0 0 .18 -.04"/></filter>
<radialGradient id="age" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#f3e9d2" stop-opacity="0"/><stop offset="1" stop-color="#e3cfa6"/></radialGradient><clipPath id="p0"><rect x="0" y="18" height="40" width="0"><animate attributeName="width" values="0;752" begin="0.1s" dur="1s" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1" fill="freeze"/></rect></clipPath><style>text{font-family:'EB Garamond','Cormorant Garamond',Garamond,Baskerville,'Times New Roman',Georgia,serif;fill:#2a1f14}
.in{animation:in 1.4s ease-out both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fade 1.6s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}
.stamp{animation:stamp .6s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes stamp{0%{opacity:0;transform:scale(1.8) rotate(-8deg)}100%{opacity:1;transform:none}}
.ink{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.2s ease-in-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style></defs>
<rect width="752" height="130" rx="4" fill="#f3e9d2"/><rect width="752" height="130" rx="4" filter="url(#blot)"/><rect width="752" height="130" rx="4" fill="url(#age)"/><rect width="752" height="130" rx="4" filter="url(#grain)"/><rect x=".5" y=".5" width="751" height="129" rx="4" fill="none" stroke="#bfa77a"/>
<text x="40" y="46" font-size="22" font-style="italic" clip-path="url(#p0)">Instruments of the Trade</text>
<path class="ink" d="M40 56 H230" stroke="#bfa77a" style="animation-delay:.6s"/>
<g transform="rotate(-1.6 85 92)"><g class="stamp" style="animation-delay:0.50s"><rect x="40" y="75" width="90" height="30" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="43" y="78" width="84" height="24" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="85" y="97" text-anchor="middle" font-size="16" letter-spacing="1" style="fill:#8e1b1b">PYTHON</text></g></g><g transform="rotate(-2.4 172 92)"><g class="stamp" style="animation-delay:0.70s"><rect x="142" y="75" width="60" height="30" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="145" y="78" width="54" height="24" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="172" y="97" text-anchor="middle" font-size="16" letter-spacing="1" style="fill:#8e1b1b">C++</text></g></g><g transform="rotate(-0.6 264 92)"><g class="stamp" style="animation-delay:0.90s"><rect x="214" y="75" width="100" height="30" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="217" y="78" width="94" height="24" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="264" y="97" text-anchor="middle" font-size="16" letter-spacing="1" style="fill:#8e1b1b">JUPYTER</text></g></g><g transform="rotate(-2.1 371 92)"><g class="stamp" style="animation-delay:1.10s"><rect x="326" y="75" width="90" height="30" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="329" y="78" width="84" height="24" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="371" y="97" text-anchor="middle" font-size="16" letter-spacing="1" style="fill:#8e1b1b">MATLAB</text></g></g><g transform="rotate(-2.6 483 92)"><g class="stamp" style="animation-delay:1.30s"><rect x="428" y="75" width="110" height="30" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="431" y="78" width="104" height="24" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="483" y="97" text-anchor="middle" font-size="16" letter-spacing="1" style="fill:#8e1b1b">SIMULINK</text></g></g><g transform="rotate(-0.6 580 92)"><g class="stamp" style="animation-delay:1.50s"><rect x="550" y="75" width="60" height="30" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="553" y="78" width="54" height="24" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="580" y="97" text-anchor="middle" font-size="16" letter-spacing="1" style="fill:#8e1b1b">GIT</text></g></g><g transform="rotate(2.5 667 92)"><g class="stamp" style="animation-delay:1.70s"><rect x="622" y="75" width="90" height="30" rx="3" fill="none" stroke="#8e1b1b" stroke-width="1.8" stroke-opacity=".85"/><rect x="625" y="78" width="84" height="24" rx="2" fill="none" stroke="#8e1b1b" stroke-opacity=".4"/><text x="667" y="97" text-anchor="middle" font-size="16" letter-spacing="1" style="fill:#8e1b1b">GITHUB</text></g></g>
</svg>