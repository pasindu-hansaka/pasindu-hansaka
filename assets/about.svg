<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" width="900" height="472" role="img" aria-label="A letter: I build Python tools, AI agents and control-system simulations, and I share the work in public. I work in Jupyter, on web front-ends and in MATLAB/Simulink, and I document what I learn so the next person has an easier start.">
<defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" seed="3"/>
<feColorMatrix values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .09 0"/></filter>
<filter id="blot" x="-50%" y="-50%" width="200%" height="200%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .4  0 0 0 0 .2  0 0 0 .18 -.04"/></filter>
<radialGradient id="age" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#f3e9d2" stop-opacity="0"/><stop offset="1" stop-color="#e3cfa6"/></radialGradient><clipPath id="p99"><rect x="560" y="322" height="80" width="0"><animate attributeName="width" values="0;300" begin="7.36s" dur="1.6s" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1" fill="freeze"/></rect></clipPath><style>text{font-family:'EB Garamond','Cormorant Garamond',Garamond,Baskerville,'Times New Roman',Georgia,serif;fill:#2a1f14}
.in{animation:in 1.4s ease-out both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fade 1.6s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}
.stamp{animation:stamp .6s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes stamp{0%{opacity:0;transform:scale(1.8) rotate(-8deg)}100%{opacity:1;transform:none}}
.ink{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.2s ease-in-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style></defs>
<rect width="900" height="472" rx="4" fill="#f3e9d2"/><rect width="900" height="472" rx="4" filter="url(#blot)"/><rect width="900" height="472" rx="4" fill="url(#age)"/><rect width="900" height="472" rx="4" filter="url(#grain)"/><rect x=".5" y=".5" width="899" height="471" rx="4" fill="none" stroke="#bfa77a"/>
<path d="M70 132 H830" stroke="#bfa77a" stroke-opacity=".35"/><path d="M70 168 H830" stroke="#bfa77a" stroke-opacity=".35"/><path d="M70 204 H830" stroke="#bfa77a" stroke-opacity=".35"/><path d="M70 240 H830" stroke="#bfa77a" stroke-opacity=".35"/><path d="M70 276 H830" stroke="#bfa77a" stroke-opacity=".35"/><path d="M70 312 H830" stroke="#bfa77a" stroke-opacity=".35"/>
<clipPath id="p1"><rect x="70" y="52" height="40" width="0"><animate attributeName="width" values="0;780" begin="0.4s" dur="0.5s" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1" fill="freeze"/></rect></clipPath><text x="80" y="80" font-size="24" font-style="italic" clip-path="url(#p1)">Dear reader,</text><clipPath id="p2"><rect x="70" y="98" height="40" width="0"><animate attributeName="width" values="0;780" begin="0.98s" dur="0.95s" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1" fill="freeze"/></rect></clipPath><text x="80" y="126" font-size="21" clip-path="url(#p2)">I build Python tools, AI agents and control-system simulations,</text><clipPath id="p3"><rect x="70" y="134" height="40" width="0"><animate attributeName="width" values="0;780" begin="2.01s" dur="0.95s" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1" fill="freeze"/></rect></clipPath><text x="80" y="162" font-size="21" clip-path="url(#p3)">and I share the work in public. Most days you will find me in</text><clipPath id="p4"><rect x="70" y="170" height="40" width="0"><animate attributeName="width" values="0;780" begin="3.04s" dur="0.95s" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1" fill="freeze"/></rect></clipPath><text x="80" y="198" font-size="21" clip-path="url(#p4)">Jupyter notebooks, on web front-ends, or deep in MATLAB/Simulink,</text><clipPath id="p5"><rect x="70" y="206" height="40" width="0"><animate attributeName="width" values="0;780" begin="4.07s" dur="0.95s" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1" fill="freeze"/></rect></clipPath><text x="80" y="234" font-size="21" clip-path="url(#p5)">tuning a controller until something finally balances.</text><clipPath id="p6"><rect x="70" y="242" height="40" width="0"><animate attributeName="width" values="0;780" begin="5.1s" dur="0.95s" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1" fill="freeze"/></rect></clipPath><text x="80" y="270" font-size="21" clip-path="url(#p6)">I document what I learn so the next person has an easier start.</text><clipPath id="p7"><rect x="70" y="278" height="40" width="0"><animate attributeName="width" values="0;780" begin="6.13s" dur="0.95s" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1" fill="freeze"/></rect></clipPath><text x="80" y="306" font-size="21" clip-path="url(#p7)">If any of it is useful to you, do write back.</text>
<text class="fade" x="580" y="332" font-size="17" font-style="italic" style="fill:#6b5232;animation-delay:7.2s">Yours sincerely,</text>
<text x="580" y="380" font-size="42" clip-path="url(#p99)" style="font-family:'Snell Roundhand','Apple Chancery','Segoe Script','Brush Script MT','URW Chancery L',cursive">Pasindu</text>
</svg>