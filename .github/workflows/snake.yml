name: Generate contribution snake and activity chart

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate animated activity chart
        run: python scripts/activity.py "${{ github.repository_owner }}" dist/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_background=#f3e9d2&color_snake=#8e1b1b&color_dots=#e6d7b6,#cdb283,#a8875a,#76593a,#3e2c1c
            dist/github-snake-dark.svg?color_background=#f3e9d2&color_snake=#8e1b1b&color_dots=#e6d7b6,#cdb283,#a8875a,#76593a,#3e2c1c

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
