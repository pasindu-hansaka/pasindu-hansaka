name: Generate contribution snake and activity chart

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate animated activity chart
        run: python scripts/activity.py "${{ github.repository_owner }}" dist/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7a1f2b&color_dots=#efe8d8,#d9cba4,#bfa56a,#a58a4a,#7d6530
            dist/github-snake-dark.svg?color_background=#10241c&color_snake=#e8d5a3&color_dots=#1a3328,#3d5236,#6e6c3f,#a58a4a,#d9bc72

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
