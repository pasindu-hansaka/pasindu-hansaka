name: Generate contribution snake and activity chart

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate animated activity chart
        run: python scripts/activity.py "${{ github.repository_owner }}" dist/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#9a2a2a&color_dots=#eff1f3,#c9ced4,#959ca5,#5c636b,#1f2328
            dist/github-snake-dark.svg?color_snake=#e5736b&color_dots=#1c2128,#363c44,#5f6670,#9aa1aa,#e6edf3

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
